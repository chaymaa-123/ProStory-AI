# Connex - Configuration Docker Compose
# Cette configuration utilise uniquement le Backend et le Frontend.
# La base de données est gérée directement sur Supabase.

services:
  # Backend Connex avec modèles IA
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connex-backend-ia
    ports:
      - "8000:8000"
    volumes:
      # Monter le code source pour le rechargement automatique
      - ./backend:/app
      # Monter le cache des modèles pour éviter de les retélécharger
      - model_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - PORT=8000
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Frontend Connex
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: connex-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - PORT=3000
    restart: unless-stopped
    command: npm run dev -- -H 0.0.0.0

volumes:
  model_cache:
    driver: local
